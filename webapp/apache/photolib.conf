# Config Apache pour PhotoLib sur yara.home.lan
# A placer dans /etc/apache2/sites-available/photolib.conf
# Nécessite: a2enmod proxy proxy_http

<VirtualHost *:80>
    ServerName photolib.home.lan

    # Restreindre au LAN (adapter le range à votre réseau)
    <Location "/">
        Require ip 192.168.0.0/16 10.0.0.0/8
    </Location>

    # Photos en taille réelle : servies directement par Apache depuis le
    # montage CIFS local (lecture seule) -- pas de passage par Python,
    # meilleure performance pour les gros fichiers RAW.
    Alias /photos /mnt/photolib-share
    <Directory "/mnt/photolib-share">
        Options -Indexes +FollowSymLinks
        Require ip 192.168.0.0/16 10.0.0.0/8
    </Directory>

    # Tout le reste (interface web + API) proxifié vers FastAPI/uvicorn
    ProxyPreserveHost On
    ProxyPass /photos !
    ProxyPass / http://127.0.0.1:8800/
    ProxyPassReverse / http://127.0.0.1:8800/

    ErrorLog ${APACHE_LOG_DIR}/photolib_error.log
    CustomLog ${APACHE_LOG_DIR}/photolib_access.log combined
</VirtualHost>
